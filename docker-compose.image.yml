# Installazione senza clonare il repository: usa l'immagine pubblicata su ghcr.io
services:
  opnsense-monitor:
    image: ghcr.io/gianfra-dev/opnsense-monitor:latest
    container_name: opnsense-monitor
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: Europe/Rome
    volumes:
      - monitor-data:/data

volumes:
  monitor-data:
